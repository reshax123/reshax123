<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="ht hd">
<title id="ht">reshax123</title>
<desc id="hd">A dark circuit board after hours — copper traces, a lit processor die, a packet stream crossing the panel. Wordmark: reshax123, full-stack developer and hardware technician.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
<stop offset="0"    stop-color="#070906"/>
<stop offset="0.40" stop-color="#0B0E09"/>
<stop offset="0.70" stop-color="#141710"/>
<stop offset="0.88" stop-color="#262417"/>
<stop offset="1"    stop-color="#3B3220"/>
</linearGradient>
<linearGradient id="board" x1="0" y1="320" x2="0" y2="440" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#141710"/>
<stop offset="1" stop-color="#080A07"/>
</linearGradient>
<linearGradient id="scrim" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0"    stop-color="#070906" stop-opacity="0.95"/>
<stop offset="0.45" stop-color="#070906" stop-opacity="0.86"/>
<stop offset="1"    stop-color="#070906" stop-opacity="0"/>
</linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="440" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#E8A33D" stop-opacity="0.85"/>
<stop offset="1" stop-color="#E8A33D" stop-opacity="0.04"/>
</linearGradient>
<linearGradient id="sweep" x1="1032" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
<stop offset="0"    stop-color="#E8A33D" stop-opacity="0.20"/>
<stop offset="0.55" stop-color="#E8A33D" stop-opacity="0.06"/>
<stop offset="1"    stop-color="#E8A33D" stop-opacity="0"/>
</linearGradient>
<linearGradient id="spill" x1="0" y1="320" x2="0" y2="440" gradientUnits="userSpaceOnUse">
<stop offset="0" stop-color="#E8A33D" stop-opacity="0.18"/>
<stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
</linearGradient>
<radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
<stop offset="0"    stop-color="#E8A33D" stop-opacity="0.26"/>
<stop offset="0.55" stop-color="#E8A33D" stop-opacity="0.09"/>
<stop offset="1"    stop-color="#E8A33D" stop-opacity="0"/>
</radialGradient>
<!-- solder mask falling into bare copper, lit from above -->
<linearGradient id="metal" x1="0" y1="136" x2="0" y2="220" gradientUnits="userSpaceOnUse">
<stop offset="0"    stop-color="#FFFFFF"/>
<stop offset="0.30" stop-color="#F6F0E2"/>
<stop offset="0.56" stop-color="#D9C9A6"/>
<stop offset="0.82" stop-color="#E8A33D"/>
<stop offset="1"    stop-color="#9C6A24"/>
</linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
<stop offset="0"   stop-color="#FFFFFF" stop-opacity="0"/>
<stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.78"/>
<stop offset="1"   stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<clipPath id="card"><rect width="1200" height="440" rx="14"/></clipPath>
<clipPath id="deck"><rect y="320" width="1200" height="120"/></clipPath>
<style><![CDATA[
    .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Menlo, monospace; }
    .wm   { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
            font-size: 90px; font-weight: 700; letter-spacing: -2.7px; }
  ]]></style>
<mask id="wmMask" maskUnits="userSpaceOnUse" x="56" y="118" width="620" height="112">
<text class="wm" x="70" y="200" fill="#FFFFFF">reshax123</text>
</mask>
</defs>
<g clip-path="url(#card)">
<rect width="1200" height="320" fill="url(#sky)"/>
<rect y="320" width="1200" height="120" fill="url(#board)"/>

<!-- indicator LEDs scattered across the board, staggered blink -->
<g fill="#E8A33D">
<circle cx="636"  cy="88"  r="1.6"><animate attributeName="opacity" values="0.16;0.70;0.16" dur="5.2s" begin="-0.4s" repeatCount="indefinite"/></circle>
<circle cx="708"  cy="132" r="1.2"><animate attributeName="opacity" values="0.10;0.52;0.10" dur="4.1s" begin="-2.6s" repeatCount="indefinite"/></circle>
<circle cx="782"  cy="72"  r="1.8"><animate attributeName="opacity" values="0.18;0.78;0.18" dur="6.4s" begin="-1.9s" repeatCount="indefinite"/></circle>
<circle cx="848"  cy="154" r="1.2"><animate attributeName="opacity" values="0.09;0.46;0.09" dur="3.8s" begin="-0.9s" repeatCount="indefinite"/></circle>
<circle cx="902"  cy="96"  r="1.4"><animate attributeName="opacity" values="0.14;0.64;0.14" dur="5.7s" begin="-3.4s" repeatCount="indefinite"/></circle>
<circle cx="964"  cy="66"  r="1.2"><animate attributeName="opacity" values="0.10;0.50;0.10" dur="4.6s" begin="-1.2s" repeatCount="indefinite"/></circle>
<circle cx="1140" cy="102" r="1.6"><animate attributeName="opacity" values="0.16;0.68;0.16" dur="6.0s" begin="-4.1s" repeatCount="indefinite"/></circle>
<circle cx="1166" cy="204" r="1.2"><animate attributeName="opacity" values="0.09;0.44;0.09" dur="4.3s" begin="-2.1s" repeatCount="indefinite"/></circle>
<circle cx="592"  cy="176" r="1.2"><animate attributeName="opacity" values="0.07;0.38;0.07" dur="4.9s" begin="-3.0s" repeatCount="indefinite"/></circle>
<circle cx="1002" cy="250" r="1.2"><animate attributeName="opacity" values="0.07;0.40;0.07" dur="5.1s" begin="-1.6s" repeatCount="indefinite"/></circle>
<circle cx="744"  cy="204" r="1.3"><animate attributeName="opacity" values="0.09;0.42;0.09" dur="6.2s" begin="-2.8s" repeatCount="indefinite"/></circle>
<circle cx="1104" cy="146" r="1.1"><animate attributeName="opacity" values="0.08;0.36;0.08" dur="5.4s" begin="-1.4s" repeatCount="indefinite"/></circle>
</g>

<!-- copper traces: orthogonal runs with 45-degree jogs -->
<g fill="none" stroke="#E8A33D" stroke-linecap="square">
<path d="M636 92 H716 L756 52 H856"            stroke-opacity="0.30" stroke-width="2"/>
<path d="M596 150 H684 L720 114 H896 L936 154 H1084" stroke-opacity="0.22" stroke-width="2"/>
<path d="M660 210 H732 L768 246 H916"          stroke-opacity="0.17" stroke-width="2"/>
<path d="M1064 62 V126 L1028 162 V206"         stroke-opacity="0.26" stroke-width="2"/>
<path d="M1156 98 V182 L1120 218 V286"         stroke-opacity="0.19" stroke-width="2"/>
<path d="M816 272 H936 L972 236 H1108"         stroke-opacity="0.15" stroke-width="2"/>
<path d="M1108 236 V300"                       stroke-opacity="0.13" stroke-width="2"/>
</g>

<!-- vias at trace junctions -->
<g fill="none" stroke="#E8A33D" stroke-width="1.6">
<circle cx="636"  cy="92"  r="3.4" stroke-opacity="0.42"/>
<circle cx="856"  cy="52"  r="3.4" stroke-opacity="0.34"/>
<circle cx="896"  cy="114" r="3.4" stroke-opacity="0.30"/>
<circle cx="1084" cy="154" r="3.4" stroke-opacity="0.34"/>
<circle cx="916"  cy="246" r="3.4" stroke-opacity="0.24"/>
<circle cx="1064" cy="62"  r="3.4" stroke-opacity="0.36"/>
<circle cx="1156" cy="98"  r="3.4" stroke-opacity="0.28"/>
<circle cx="816"  cy="272" r="3.4" stroke-opacity="0.22"/>
</g>
<g fill="#E8A33D">
<circle cx="636"  cy="92"  r="1.3" opacity="0.75"/>
<circle cx="896"  cy="114" r="1.3" opacity="0.6"/>
<circle cx="1084" cy="154" r="1.3" opacity="0.65"/>
<circle cx="1064" cy="62"  r="1.3" opacity="0.7"/>
</g>

<!-- packet stream: dashes running the long trace -->
<path d="M596 150 H684 L720 114 H896 L936 154 H1084" fill="none"
stroke="#F2E6CC" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="18 286">
<animate attributeName="stroke-dashoffset" values="304;0" dur="4.6s" repeatCount="indefinite"/>
</path>
<path d="M660 210 H732 L768 246 H916" fill="none"
stroke="#F2E6CC" stroke-opacity="0.42" stroke-width="2" stroke-dasharray="12 168">
<animate attributeName="stroke-dashoffset" values="0;-180" dur="7.4s" repeatCount="indefinite"/>
</path>

<!-- processor die, right-hand board edge -->
<circle cx="1032" cy="174" r="196" fill="url(#halo)"/>
<g opacity="0.9">
<path d="M1032 174 L648 94 L648 254 Z" fill="url(#sweep)">
<animateTransform attributeName="transform" type="rotate"
values="-11 1032 174; 9 1032 174; -11 1032 174"
dur="13s" calcMode="spline"
keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
repeatCount="indefinite"/>
</path>
</g>
<rect x="990" y="132" width="84" height="84" rx="6" fill="#171C14" fill-opacity="0.94"/>
<rect x="990" y="132" width="84" height="84" rx="6" fill="none" stroke="#E8A33D" stroke-opacity="0.34"/>
<rect x="1006" y="148" width="52" height="52" rx="3" fill="#0E120D"/>
<rect x="1006" y="148" width="52" height="52" rx="3" fill="none" stroke="#E8A33D" stroke-opacity="0.22"/>
<g stroke="#E8A33D" stroke-opacity="0.36" stroke-width="2" stroke-linecap="round">
<path d="M998 142 H1010 M998 158 H1010 M998 174 H1010 M998 190 H1010 M998 206 H1010"/>
<path d="M1054 142 H1066 M1054 158 H1066 M1054 174 H1066 M1054 190 H1066 M1054 206 H1066"/>
<path d="M1000 142 V152 M1016 142 V152 M1032 142 V152 M1048 142 V152 M1064 142 V152"/>
<path d="M1000 196 V206 M1016 196 V206 M1032 196 V206 M1048 196 V206 M1064 196 V206"/>
</g>
<g stroke="#F2E6CC" stroke-opacity="0.32" stroke-width="1.4" stroke-linecap="round" fill="none">
<path d="M1014 178 H1024 L1030 168 L1040 190 L1046 178 H1050"/>
</g>
<circle cx="1032" cy="174" r="2.6" fill="#E8A33D">
<animate attributeName="opacity" values="1;0.22;1" dur="3.4s" repeatCount="indefinite"/>
</circle>

<!-- silkscreen legend, dim -->
<g class="mono" font-size="9" letter-spacing="1.6" fill="#7A837B" opacity="0.5">
<text x="1096" y="74">J3</text>
<text x="584" y="128">U1</text>
<text x="930" y="266">R14</text>
</g>

<!-- board deck: horizontal bus lines with travelling dashes -->
<g clip-path="url(#deck)">
<path d="M0 356 H1200" stroke="#E8A33D" stroke-opacity="0.22" stroke-width="1.4" stroke-dasharray="12 46">
<animate attributeName="stroke-dashoffset" values="0;-116" dur="14s" repeatCount="indefinite"/>
</path>
<path d="M0 370 H1200" stroke="#E8A33D" stroke-opacity="0.15" stroke-width="1.4" stroke-dasharray="34 88">
<animate attributeName="stroke-dashoffset" values="0;244" dur="28s" repeatCount="indefinite"/>
</path>
<path d="M0 385 H1200" stroke="#E8A33D" stroke-opacity="0.20" stroke-width="1.5" stroke-dasharray="18 62">
<animate attributeName="stroke-dashoffset" values="0;-160" dur="19s" repeatCount="indefinite"/>
</path>
<path d="M0 401 H1200" stroke="#E8A33D" stroke-opacity="0.14" stroke-width="1.5" stroke-dasharray="42 104">
<animate attributeName="stroke-dashoffset" values="0;292" dur="31s" repeatCount="indefinite"/>
</path>
<path d="M0 419 H1200" stroke="#E8A33D" stroke-opacity="0.18" stroke-width="1.6" stroke-dasharray="22 70">
<animate attributeName="stroke-dashoffset" values="0;-184" dur="21s" repeatCount="indefinite"/>
</path>
</g>
<!-- light spill from the die onto the deck -->
<rect x="1000" y="320" width="64" height="120" fill="url(#spill)">
<animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/>
</rect>

<!-- text scrim -->
<rect width="700" height="440" fill="url(#scrim)"/>
<text class="mono" x="72" y="106" font-size="16" letter-spacing="3" fill="#8A8F84">github.com/reshax123</text>

<!-- wordmark: cast shadow, solder-to-copper fill, travelling specular sheen -->
<text class="wm" x="70" y="203" fill="#050705" fill-opacity="0.62">reshax123</text>
<text class="wm" x="70" y="200" fill="url(#metal)">reshax123</text>
<g mask="url(#wmMask)">
<g transform="skewX(-16)">
<rect y="112" width="170" height="124" fill="url(#sheen)">
<animateTransform attributeName="transform" type="translate"
values="-80 0; -80 0; 720 0; 720 0" keyTimes="0;0.07;0.33;1"
calcMode="spline" keySplines="0 0 1 1; 0.32 0 0.5 1; 0 0 1 1"
dur="7.5s" repeatCount="indefinite"/>
</rect>
</g>
</g>
<path d="M72 236 H520" stroke="#E8A33D" stroke-opacity="0.26" stroke-width="1.2"/>
<path d="M72 236 H520" stroke="#F2E6CC" stroke-opacity="0.85" stroke-width="1.2" stroke-dasharray="64 384">
<animate attributeName="stroke-dashoffset" values="448;0" dur="7s" repeatCount="indefinite"/>
</path>

<text class="mono" x="72" y="276" font-size="18" fill="#A8ADA0">full stack dev &#183; hardware tech &#183; local ai gateways</text>
<circle cx="78" cy="308" r="4.2" fill="#E8A33D">
<animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/>
</circle>
<text class="mono" x="96" y="313" font-size="14" letter-spacing="1.8" fill="#8A8F84">REACT &#183; PHP &#183; FLUTTER &#183; BUN &#183; GO</text>

<rect x="0" y="16" width="3" height="408" fill="url(#edge)"/>
<rect width="1200" height="440" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/>
</g>
</svg>
